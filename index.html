<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generator de albume foto</title>
  <meta name="description" content="Generator de albume cu fotografii – proiect individual, Săpt. 9">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" data-nav="home">
      <span class="logo" aria-hidden="true">▣</span> FotoAlbum
    </a>
    <nav>
      <button class="btn ghost" data-nav="home">Albume</button>
      <button class="btn primary" data-nav="new">+ Album nou</button>
    </nav>
  </header>

  <main>
    <!-- Lista de albume -->
    <section id="view-home" class="view">
      <div class="hero">
        <h1>Generator de albume cu fotografii</h1>
        <p>Creează albume, încarcă fotografii, alege un stil de afișare, vizionează-le ca slideshow și descarcă albumul ca pagină HTML.</p>
        <input id="search" type="search" placeholder="Caută album…" aria-label="Caută album">
      </div>
      <div id="albums" class="albums"></div>
    </section>

    <!-- Creare / editare album -->
    <section id="view-new" class="view" hidden>
      <h2 id="form-title">Album nou</h2>
      <form id="album-form" class="card form">
        <label>Titlu album
          <input name="title" required maxlength="60" placeholder="ex. Vacanța 2026">
        </label>
        <label>Descriere
          <textarea name="desc" rows="2" maxlength="200" placeholder="Câteva cuvinte despre album"></textarea>
        </label>
        <label>Stil de afișare
          <select name="layout">
            <option value="grid">Grilă</option>
            <option value="masonry">Mozaic</option>
            <option value="polaroid">Polaroid</option>
          </select>
        </label>
        <div id="drop" class="drop" tabindex="0">
          <p><strong>Trage fotografiile aici</strong> sau apasă pentru a le alege</p>
          <input id="files" type="file" accept="image/*" multiple hidden>
        </div>
        <div id="preview" class="preview"></div>
        <div class="actions">
          <button type="button" class="btn ghost" data-nav="home">Renunță</button>
          <button type="submit" class="btn primary">Salvează albumul</button>
        </div>
      </form>
    </section>

    <!-- Vizualizare album -->
    <section id="view-album" class="view" hidden>
      <div class="album-head">
        <div>
          <h2 id="a-title"></h2>
          <p id="a-desc" class="muted"></p>
        </div>
        <div class="album-tools">
          <select id="a-layout" aria-label="Stil de afișare">
            <option value="grid">Grilă</option>
            <option value="masonry">Mozaic</option>
            <option value="polaroid">Polaroid</option>
          </select>
          <button class="btn" id="a-slide">▶ Slideshow</button>
          <button class="btn" id="a-export">⬇ Descarcă HTML</button>
          <button class="btn" id="a-edit">Editează</button>
          <button class="btn danger" id="a-delete">Șterge</button>
        </div>
      </div>
      <div id="gallery" class="gallery grid"></div>
    </section>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-close" aria-label="Închide">×</button>
    <button class="lb-prev" aria-label="Anterioară">‹</button>
    <figure>
      <img id="lb-img" alt="">
      <figcaption id="lb-cap"></figcaption>
    </figure>
    <button class="lb-next" aria-label="Următoarea">›</button>
  </div>

  <footer class="footer">Proiect individual · Generator de albume cu fotografii · 2026</footer>

  <script src="js/app.js"></script>
</body>
</html>
